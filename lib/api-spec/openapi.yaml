openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: planner
    description: AI-assisted daily planning
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /planner/chat:
    post:
      operationId: planDayChat
      tags: [planner]
      summary: Chat with the daily schedule planner
      description: Responds to a planning message and may return a proposed timed schedule.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlannerChatInput"
      responses:
        "200":
          description: Assistant reply and optional proposed schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlannerChatReply"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Schedule assistant unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests in the current rate limit window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Schedule assistant is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    PlannerMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 4000
      required: [role, content]
    PlannerTaskContext:
      type: object
      properties:
        title:
          type: string
        startTime:
          type: string
        endTime:
          type: string
        status:
          type: string
          enum: [planned, done, not_done]
      required: [title, startTime, endTime, status]
    PlannerChatInput:
      type: object
      properties:
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        timeZone:
          type: string
          minLength: 1
          maxLength: 80
        dayStart:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        dayEnd:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        messages:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: "#/components/schemas/PlannerMessage"
        existingTasks:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/PlannerTaskContext"
      required: [date, timeZone, dayStart, dayEnd, messages, existingTasks]
    ProposedTask:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 180
        startTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        endTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        category:
          type: string
          maxLength: 40
      required: [title, startTime, endTime]
    ScheduleProposal:
      type: object
      properties:
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        summary:
          type: string
          maxLength: 500
        tasks:
          type: array
          minItems: 1
          maxItems: 40
          items:
            $ref: "#/components/schemas/ProposedTask"
      required: [date, summary, tasks]
    PlannerChatReply:
      type: object
      properties:
        message:
          type: string
          maxLength: 4000
        plan:
          oneOf:
            - $ref: "#/components/schemas/ScheduleProposal"
            - type: "null"
      required: [message, plan]

